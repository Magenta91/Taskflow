services:
  - type: web
    name: taskflow-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run seed && npm start
    envVars:
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: ./data/taskflow.db
      - key: CORS_ORIGIN
        sync: false
